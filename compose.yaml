services:
  epapers:
    image: ghcr.io/ddgsdde/epapers:0.3.1
    container_name: epapers
    restart: unless-stopped
    env_file: .env
    environment:
      EPAPERS_HOST: 0.0.0.0
      EPAPERS_DATA_DIR: /data
      EPAPERS_RESOURCE_DIR: /app
      EPAPERS_DEMO: "false"
    ports:
      - "8099:8099"
    volumes:
      - ./data:/data
    read_only: true
    tmpfs:
      - /tmp:size=32m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "3"
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8099/health', timeout=5)"]
      interval: 30s
      timeout: 6s
      retries: 3
