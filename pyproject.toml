[project]
name = "epapers"
version = "0.3.2"
description = "Local Home Assistant e-paper studio and BLE gateway coordinator"
requires-python = ">=3.13"
dependencies = ["fastapi>=0.115", "uvicorn[standard]>=0.34", "pillow>=11", "httpx>=0.28", "websockets>=14", "aiosqlite>=0.21", "python-multipart>=0.0.20", "qrcode>=8", "fonttools>=4.56", "pydantic-settings>=2.8", "pyyaml>=6"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.25", "ruff>=0.11", "esptool>=5", "pyserial>=3.5"]

[project.scripts]
epapers = "epapers.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/epapers"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100
